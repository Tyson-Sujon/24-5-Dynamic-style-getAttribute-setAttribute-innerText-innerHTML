<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setAttribute Practice</title>
</head>
<body>
    <h1 id="inner">first try set attribute </h1>
    <h1 id="title">I am learning JavaScript</h1>

    <img id="myImage" src="old.jpg" alt="Old Image" width="300">

    <br><br>

    <a id="myLink" href="https://example.com">
        Visit Website
    </a>

    <script>
        // Select elements
        const title = document.querySelector("#title");
        const image = document.querySelector("#myImage");
        const link = document.querySelector("#myLink");

        // Change id
        title.setAttribute("id", "new-title");

        // Change image source
        image.setAttribute("src", "https://picsum.photos/300/200");

        // Change alt attribute
        image.setAttribute("alt", "Random Image");

        // Change link
        link.setAttribute("href", "https://google.com");

        // Change link target
        link.setAttribute("target", "_blank");
    </script>

</body>
</html>
